{% extends "base.html" %}
{% block title %}Contact{% endblock %}
{% block content %}
<h1>Contact</h1>
<p class="lead">Reach me through any of these.</p>
<ul class="cards contact">
  <li class="card"><strong>Email</strong><a href="mailto:{{ p.email }}">{{ p.email }}</a></li>
  <li class="card"><strong>Phone</strong><a href="tel:{{ p.phone }}">{{ p.phone }}</a></li>
  <li class="card"><strong>Location</strong><span>{{ p.location }}</span></li>
  <li class="card"><strong>GitHub</strong><a href="{{ p.github }}" target="_blank" rel="noopener">{{ p.github }}</a></li>
</ul>
{% endblock %}
