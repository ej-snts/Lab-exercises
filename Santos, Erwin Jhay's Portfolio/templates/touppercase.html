{% extends "base.html" %}
{% block title %}toUpperCase{% endblock %}
{% block content %}
<a class="back" href="{{ url_for('works') }}">&larr; Back to works</a>
<h1>toUpperCase</h1>
<p class="lead">Type any text and convert it to capital letters.</p>
<form method="post" class="tool">
  <label for="text">Your text</label>
  <textarea id="text" name="text" rows="3" required>{{ text }}</textarea>
  <button class="pill" type="submit">Convert</button>
</form>
{% if result %}
<div class="result" role="status"><span>Result</span><strong>{{ result }}</strong></div>
{% endif %}
{% endblock %}
